{% extends "base.html" %}{% block title %}Log in — InterviewIQ{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p class="muted">Your next interview starts with one good answer.</p>
<form method="post" action="/login" class="form">
<label>Email address<input name="email" type="email" required placeholder="you@example.com"></label>
<label>Password<input name="password" type="password" required placeholder="Your password"></label>
<button class="btn primary full" type="submit">Log in →</button></form>
<p class="form-bottom">New here? <a href="/signup">Create an account</a></p></section></div>
{% endblock %}
